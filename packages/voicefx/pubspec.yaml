name: voicefx
description: "VoiceFX: offline vocal pitch correction and effects engine (Dart FFI plugin)."
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.10.0
  flutter: '>=3.38.0'

dependencies:
  ffi: ^2.1.3
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
